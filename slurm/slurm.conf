# Hybrid Slurm cluster — AWS login + dual controllers, AWS+GCP compute
# Power save: https://slurm.schedmd.com/power_save.html
# Docs: https://slurm.schedmd.com/documentation.html

ClusterName=slurm-hybrid
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
MpiDefault=none
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
ReturnToService=2

# Dual controllers on AWS (active/backup)
SlurmctldHost=ctrl1(10.0.1.11)
SlurmctldHost=ctrl2(10.0.1.12)
SlurmctldPort=6817
SlurmdPort=6818

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

# Accounting
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=ctrl1
AccountingStoragePort=6819
AccountingStorageTRES=gres/gpu

# Scheduling
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill

# Power save (automatic suspend/resume for CLOUD nodes)
SuspendProgram=/usr/sbin/slurm_suspend
ResumeProgram=/usr/sbin/slurm_resume
ResumeFailProgram=/usr/sbin/slurm_resume_fail
SuspendTimeout=120
ResumeTimeout=600
ResumeRate=10
SuspendRate=10

# Do not auto-suspend controllers or login
SuspendExcNodes=login,ctrl1,ctrl2
SuspendTime=INFINITE

DebugFlags=Power

SlurmctldParameters=enable_configless,cloud_dns,idle_on_node_suspend,power_save_interval=10

# Node defaults
NodeName=DEFAULT CPUs=4 RealMemory=7800 Sockets=1 CoresPerSocket=4 ThreadsPerCore=1

# Login (submission only — no slurmd)
NodeName=login NodeAddr=10.0.1.10 State=DOWN Reason="login node"

# Controllers (no compute scheduling)
NodeName=ctrl1 NodeAddr=10.0.1.11 State=DOWN Reason="controller"
NodeName=ctrl2 NodeAddr=10.0.1.12 State=DOWN Reason="controller"

# Cloud compute — power save targets
NodeName=aws-compute NodeAddr=10.0.2.10 State=CLOUD Feature=aws,cloud Weight=10
NodeName=gcp-compute NodeAddr=10.1.1.10 State=CLOUD Feature=gcp,cloud Weight=10

# Partitions
PartitionName=cloud Nodes=aws-compute,gcp-compute Default=NO MaxTime=24:00:00 \
    SuspendTime=300 AllowGroups=ALL State=UP

PartitionName=hybrid Nodes=aws-compute,gcp-compute Default=YES MaxTime=24:00:00 \
    SuspendTime=300 AllowGroups=ALL State=UP

# Optional: prefer AWS nodes (lower weight = higher priority in some configs)
# NodeName=aws-compute Weight=5
