#cloud-config
package_update: true

users:
  - name: slurmadmin
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /home/slurmadmin/.ssh/authorized_keys
    defer: true
    owner:
      name: slurmadmin
      group: slurmadmin
    permissions: "0600"
    content: |
      ${ssh_public_key}

  - path: /etc/slurm/slurm.conf
    content: |
      ${indent(6, slurm_conf)}
  - path: /opt/slurm-hybrid/install-slurm.sh.b64
    encoding: b64
    content: ${install_script_b64}
  - path: /opt/slurm-hybrid/bootstrap-compute.sh.b64
    encoding: b64
    content: ${bootstrap_compute_b64}

runcmd:
  - [ bash, -lc, "if id ubuntu &>/dev/null && [[ -f /home/ubuntu/.ssh/authorized_keys ]]; then install -d -m 700 -o slurmadmin -g slurmadmin /home/slurmadmin/.ssh; while read -r line; do [[ -n \"$line\" ]] && ! grep -qxF \"$line\" /home/slurmadmin/.ssh/authorized_keys 2>/dev/null && echo \"$line\" >> /home/slurmadmin/.ssh/authorized_keys; done < /home/ubuntu/.ssh/authorized_keys; chmod 600 /home/slurmadmin/.ssh/authorized_keys; fi" ]
  - [ bash, -lc, "base64 -d /opt/slurm-hybrid/install-slurm.sh.b64 > /opt/slurm-hybrid/install-slurm.sh && chmod +x /opt/slurm-hybrid/install-slurm.sh && base64 -d /opt/slurm-hybrid/bootstrap-compute.sh.b64 > /opt/slurm-hybrid/bootstrap-compute.sh && chmod +x /opt/slurm-hybrid/bootstrap-compute.sh" ]
  - [ bash, -lc, "SLURM_VERSION=${slurm_version} NODE_NAME=${node_name} CLOUD_PROVIDER=${cloud_provider} INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id) /opt/slurm-hybrid/bootstrap-compute.sh" ]
