#cloud-config
package_update: true

users:
  - name: slurmadmin
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - munge
  - mariadb-server
  - jq
  - awscli

runcmd:
  - [ bash, -lc, "install -d -m 755 /opt/slurm-hybrid /etc/slurm /etc/slurm-hybrid" ]
