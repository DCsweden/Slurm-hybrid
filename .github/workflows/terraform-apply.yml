name: Terraform Apply (create infra)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "slurm/**"
      - "scripts/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: eu-north-1
  TF_VAR_aws_region: eu-north-1
  TF_VAR_gcp_region: europe-north2
  TF_VAR_gcp_zone: europe-north2-a

jobs:
  apply:
    name: Create hybrid Slurm infrastructure
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-slurm-hybrid
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=slurm-hybrid/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.SLURM_DB_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.SLURM_DB_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "## Terraform outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || terraform output >> "$GITHUB_STEP_SUMMARY"

  bootstrap-slurm:
    name: Bootstrap Slurm (install + start)
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    if: success()

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=slurm-hybrid/terraform.tfstate" \
            -backend-config="region=eu-north-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Load endpoints
        id: tf
        working-directory: terraform
        run: |
          echo "ctrl1=$(terraform output -raw ctrl1_public_ip)" >> "$GITHUB_OUTPUT"
          echo "ctrl2=$(terraform output -raw ctrl2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "login=$(terraform output -raw login_public_ip)" >> "$GITHUB_OUTPUT"
          echo "aws_compute_id=$(terraform output -raw aws_compute_instance_id)" >> "$GITHUB_OUTPUT"
          echo "aws_compute_ip=$(terraform output -raw aws_compute_private_ip)" >> "$GITHUB_OUTPUT"
          echo "gcp_compute_ip=$(terraform output -raw gcp_compute_private_ip)" >> "$GITHUB_OUTPUT"
          terraform output -raw power_save_gcp_key > /tmp/gcp-sa.json

      - name: Setup SSH private key
        id: sshkey
        run: |
          install -m 700 -d "${{ runner.temp }}/ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "${{ runner.temp }}/ssh/cluster_key"
          chmod 600 "${{ runner.temp }}/ssh/cluster_key"
          echo "path=${{ runner.temp }}/ssh/cluster_key" >> "$GITHUB_OUTPUT"

      - name: Resolve DB password
        working-directory: terraform
        run: |
          if [[ -n "${{ secrets.SLURM_DB_PASSWORD }}" ]]; then
            echo "DB_PASSWORD=${{ secrets.SLURM_DB_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "DB_PASSWORD=$(terraform output -raw db_password)" >> "$GITHUB_ENV"
          fi

      - name: Run bootstrap-cluster.sh
        env:
          SSH_KEY: ${{ steps.sshkey.outputs.path }}
          CTRL1_IP: ${{ steps.tf.outputs.ctrl1 }}
          CTRL2_IP: ${{ steps.tf.outputs.ctrl2 }}
          LOGIN_IP: ${{ steps.tf.outputs.login }}
          AWS_COMPUTE_INSTANCE_ID: ${{ steps.tf.outputs.aws_compute_id }}
          AWS_COMPUTE_IP: ${{ steps.tf.outputs.aws_compute_ip }}
          GCP_COMPUTE_IP: ${{ steps.tf.outputs.gcp_compute_ip }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          GCP_SA_KEY_FILE: /tmp/gcp-sa.json
        run: |
          chmod +x scripts/bootstrap-cluster.sh scripts/distribute-munge.sh
          set -o pipefail
          bash scripts/bootstrap-cluster.sh 2>&1 | tee bootstrap.log

      - name: Bootstrap summary
        run: |
          echo "## Slurm bootstrap" >> "$GITHUB_STEP_SUMMARY"
          tail -40 bootstrap.log >> "$GITHUB_STEP_SUMMARY"
