name: Terraform Destroy (remove infra)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm deletion of all infrastructure'
        required: true
        type: string

permissions:
  contents: read

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: eu-north-1
  TF_VAR_aws_region: eu-north-1
  TF_VAR_gcp_region: europe-north2
  TF_VAR_gcp_zone: europe-north2-a

jobs:
  destroy:
    name: Destroy hybrid Slurm infrastructure
    runs-on: ubuntu-latest
    environment: production-destroy
    concurrency:
      group: terraform-slurm-hybrid
      cancel-in-progress: false

    steps:
      - name: Confirm destruction
        if: inputs.confirm_destroy != 'destroy'
        run: |
          echo "::error::Input confirm_destroy must be exactly 'destroy'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=slurm-hybrid/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
          TF_VAR_db_password: ${{ secrets.SLURM_DB_PASSWORD }}
        run: terraform destroy -input=false -auto-approve

      - name: Destroy complete
        run: echo "Infrastructure destroyed. State remains in S3 for audit until bucket cleanup." >> "$GITHUB_STEP_SUMMARY"
